name: Test Reporter

on:
  push:
    branches:
      - main
      - unstable
  pull_request:
    branches:
      - main
      - unstable
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write
  pull-requests: write

jobs:
  test-dotnet:
    name: .NET Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Run .NET Tests
        continue-on-error: true
        run: |
          dotnet test FiveM.Nui.slnx --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Smoke-test benchmark selection and runtime
        run: |
          dotnet run --project tests/FiveM.Nui.Benchmarks/FiveM.Nui.Benchmarks.csproj --configuration Release -- --filter "*MessagingBenchmarks.SendAsync_Event" --job dry | tee benchmark-smoke.log
          grep -E "SendAsync_Event.*[0-9].*(ns|us|ms|s)" benchmark-smoke.log

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: .NET Unit Tests
          path: 'TestResults/*.trx'
          reporter: dotnet-trx
          report-title: 'FiveM.Nui .NET Test Suite'
          badge-title: '.NET 10 Tests'
          use-actions-summary: 'true'
          list-suites: 'all'
          list-tests: 'all'
          max-annotations: '50'
          fail-on-error: true
          fail-on-empty: true
          collapsed: 'auto'

  test-typescript:
    name: "TS: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "@fivem-nui/error"
            dir: "packages/fivem-nui/error"
          - name: "@fivem-nui/core"
            dir: "packages/fivem-nui/core"
          - name: "@fivem-nui/svelte"
            dir: "packages/svelte/bridge"
          - name: "@fivem-nui/svelte-components"
            dir: "packages/svelte/components"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            packages/fivem-nui/error/package.json
            packages/fivem-nui/core/package.json
            packages/svelte/bridge/package.json
            packages/svelte/components/package.json

      - name: Build local dependencies
        if: matrix.name == '@fivem-nui/svelte' || matrix.name == '@fivem-nui/svelte-components'
        run: |
          npm --prefix packages/fivem-nui/error install --legacy-peer-deps
          npm --prefix packages/fivem-nui/error run build
          npm --prefix packages/fivem-nui/core install --legacy-peer-deps
          npm --prefix packages/fivem-nui/core run build
          if [ "${{ matrix.name }}" = "@fivem-nui/svelte-components" ]; then
            npm --prefix packages/svelte/bridge install --legacy-peer-deps
            npm --prefix packages/svelte/bridge run build
          fi

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm install --legacy-peer-deps

      - name: Run Vitest with Coverage
        working-directory: ${{ matrix.dir }}
        continue-on-error: true
        run: npx vitest run --coverage --reporter=default --reporter=junit --outputFile.junit=junit.xml

      - name: Build and type-check package
        working-directory: ${{ matrix.dir }}
        run: |
          npm run build
          npm run check

      - name: Smoke-test native Node ESM entrypoint
        if: matrix.name != '@fivem-nui/svelte-components'
        working-directory: ${{ matrix.dir }}
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/fivem-nui-esm-${{ strategy.job-index }}"
          mkdir -p "$pack_dir"

          if [ "${{ matrix.name }}" = "@fivem-nui/core" ]; then
            npm pack ../error --pack-destination "$pack_dir"
            npm install --no-save "$pack_dir"/fivem-nui-error-*.tgz
            node -e "Promise.all([import('./dist/index.js'), import('./dist/testing/index.js'), import('./dist/diagnostics/index.js')])"
          elif [ "${{ matrix.name }}" = "@fivem-nui/svelte" ]; then
            npm pack ../../fivem-nui/error --pack-destination "$pack_dir"
            npm pack ../../fivem-nui/core --pack-destination "$pack_dir"
            npm install --no-save "$pack_dir"/fivem-nui-error-*.tgz "$pack_dir"/fivem-nui-core-*.tgz
            node -e "Promise.all([import('./dist/index.js'), import('./dist/mock/index.js'), import('./dist/actions/index.js')])"
          else
            node -e "import('./dist/index.js')"
          fi

      - name: Publish Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: "${{ matrix.name }} Tests"
          path: "${{ matrix.dir }}/junit.xml"
          reporter: java-junit
          report-title: "FiveM.Nui ${{ matrix.name }} Test Suite"
          badge-title: "${{ matrix.name }}"
          use-actions-summary: 'true'
          list-suites: 'all'
          list-tests: 'all'
          max-annotations: '50'
          fail-on-error: true
          fail-on-empty: false
          collapsed: 'auto'

      - name: Publish Vitest Coverage Report
        uses: davelosert/vitest-coverage-report-action@v2
        if: ${{ !cancelled() }}
        with:
          name: "${{ matrix.name }}"
          working-directory: ${{ matrix.dir }}
          file-coverage-mode: changes
          threshold-icons: "{0: '🔴', 70: '🟠', 90: '🟢'}"
