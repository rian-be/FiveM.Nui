name: Contributor Takes Action

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  take:
    name: Assign issue to contributor
    # Run only on issues (not pull requests) when comment contains the trigger
    if: ${{ !github.event.issue.pull_request && contains(github.event.comment.body, '.take') }}
    runs-on: ubuntu-latest
    steps:
      - name: Assign issue
        uses: bdougie/take-action@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          trigger: '.take'
          message: |
            Thanks for taking this on, @${{ github.actor }}! 🚀
            The issue has been assigned to you. Feel free to ask if you have any questions or need guidance!
          issueCurrentlyAssignedMessage: |
            Hey @${{ github.actor }}, this issue is already assigned to another contributor.
