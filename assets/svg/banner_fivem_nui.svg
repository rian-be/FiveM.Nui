<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%">
  <defs>
    <!-- Main background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#101014" />
      <stop offset="100%" stop-color="#16161D" />
    </linearGradient>

    <!-- FiveM / Svelte Orange gradient -->
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A3D" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Glow behind layers -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="36" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow under isometric cards -->
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-8" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Technical grid -->
    <pattern id="tech-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.025" />
    </pattern>

    <!-- Grid intersection dots -->
    <pattern id="dot-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="32" cy="32" r="1" fill="#FFFFFF" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- 1. BASE AND BACKGROUND GRID -->
  <rect width="960" height="340" rx="16" fill="url(#bg-grad)" stroke="#27272A" stroke-width="1.5" />
  <rect width="960" height="340" rx="16" fill="url(#tech-grid)" />
  <rect width="960" height="340" rx="16" fill="url(#dot-grid)" />

  <!-- 2. EXPANDED TECHNICAL BACKGROUND (Wireframes & Node Lines) -->
  <!-- UI window wireframe in top-right background -->
  <g transform="translate(760, 20)" opacity="0.18">
    <rect width="170" height="100" rx="6" fill="#18181B" stroke="#52525B" stroke-width="1" />
    <line x1="0" y1="18" x2="170" y2="18" stroke="#52525B" stroke-width="1" />
    <circle cx="10" cy="9" r="2.5" fill="#EA580C" />
    <circle cx="18" cy="9" r="2.5" fill="#52525B" />
    <circle cx="26" cy="9" r="2.5" fill="#52525B" />
    <rect x="10" y="28" width="40" height="60" rx="3" fill="none" stroke="#52525B" stroke-width="1" stroke-dasharray="3 2" />
    <rect x="58" y="28" width="102" height="28" rx="3" fill="none" stroke="#52525B" stroke-width="1" />
    <line x1="58" y1="28" x2="160" y2="56" stroke="#52525B" stroke-width="0.5" />
    <rect x="58" y="64" width="48" height="24" rx="3" fill="none" stroke="#EA580C" stroke-width="1" />
    <rect x="112" y="64" width="48" height="24" rx="3" fill="none" stroke="#52525B" stroke-width="1" />
  </g>

  <!-- Data transmission lines (Node Graph) on the left side -->
  <g opacity="0.35">
    <path d="M 0 140 C 35 140, 45 170, 80 170" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="4 3" />
    <path d="M 0 210 C 30 210, 40 185, 80 185" fill="none" stroke="#52525B" stroke-width="1.5" />
    <path d="M 0 250 C 40 250, 50 205, 80 205" fill="none" stroke="#3F3F46" stroke-width="1" />
    <circle cx="38" cy="154" r="3" fill="#EA580C" />
    <circle cx="28" cy="205" r="2.5" fill="#71717A" />
    <circle cx="48" cy="232" r="2" fill="#52525B" />
  </g>

  <!-- Subtle glow under the icon section -->
  <circle cx="170" cy="170" r="85" fill="#EA580C" opacity="0.14" filter="url(#glow)" />

  <!-- 3. MAIN EMBLEM: ISOMETRIC LAYERS (A1) -->
  <!-- Centered in left column (X: 55..295, Y: 55..285) -->
  <g transform="translate(62, 182) scale(0.76)">
    
    <!-- LAYER 1: C# Client Script (.NET 10) -->
    <g transform="translate(0, -65) skewY(-16)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="176" height="142" rx="10" fill="#141418" stroke="#3F3F46" stroke-width="2.5" />
      <line x1="0" y1="28" x2="176" y2="28" stroke="#27272A" stroke-width="2" />
      <circle cx="14" cy="14" r="3.5" fill="#52525B" />
      <circle cx="25" cy="14" r="3.5" fill="#52525B" />
      <circle cx="36" cy="14" r="3.5" fill="#52525B" />
      <text x="128" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#52525B">C# .NET</text>
      <!-- C# code -->
      <rect x="14" y="42" width="48" height="6" rx="3" fill="#EA580C" fill-opacity="0.6" />
      <rect x="68" y="42" width="64" height="6" rx="3" fill="#52525B" />
      <rect x="24" y="56" width="96" height="6" rx="3" fill="#3F3F46" />
      <rect x="24" y="70" width="76" height="6" rx="3" fill="#27272A" />
      <rect x="24" y="84" width="84" height="6" rx="3" fill="#3F3F46" />
      <rect x="14" y="98" width="36" height="6" rx="3" fill="#52525B" />
      <rect x="14" y="114" width="60" height="6" rx="3" fill="#27272A" />
    </g>

    <!-- LAYER 2: Compile-Time Contract Generator -->
    <g transform="translate(68, -22) skewY(-16)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="176" height="142" rx="10" fill="#1C1C22" stroke="#71717A" stroke-width="2.5" />
      <line x1="0" y1="28" x2="176" y2="28" stroke="#3F3F46" stroke-width="2" />
      <circle cx="14" cy="14" r="3.5" fill="#A1A1AA" />
      <circle cx="25" cy="14" r="3.5" fill="#A1A1AA" />
      <circle cx="36" cy="14" r="3.5" fill="#A1A1AA" />
      <text x="116" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#A1A1AA">CONTRACT</text>
      <!-- Contract / strong typing lines -->
      <rect x="14" y="42" width="72" height="6" rx="3" fill="#A1A1AA" />
      <rect x="26" y="56" width="110" height="6" rx="3" fill="#71717A" />
      <rect x="26" y="70" width="88" height="6" rx="3" fill="#52525B" />
      <rect x="26" y="84" width="96" height="6" rx="3" fill="#EA580C" fill-opacity="0.75" />
      <rect x="14" y="98" width="52" height="6" rx="3" fill="#71717A" />
      <rect x="14" y="114" width="80" height="6" rx="3" fill="#3F3F46" />
    </g>

    <!-- LAYER 3: NUI Frontend (Svelte 5 Runes) -->
    <g transform="translate(136, 21) skewY(-16)" filter="url(#card-shadow)">
      <rect x="0" y="0" width="176" height="142" rx="10" fill="url(#orange-grad)" stroke="#FF9466" stroke-width="2" />
      <line x1="0" y1="28" x2="176" y2="28" stroke="#FAFAFA" stroke-opacity="0.22" stroke-width="2" />
      <circle cx="14" cy="14" r="3.5" fill="#FAFAFA" />
      <circle cx="25" cy="14" r="3.5" fill="#FAFAFA" />
      <circle cx="36" cy="14" r="3.5" fill="#FAFAFA" />
      <text x="118" y="18" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="800" fill="#FAFAFA">SVELTE 5</text>

      <!-- Rich NUI interface (Sidebar + Dashboard + Chart) -->
      <rect x="14" y="40" width="42" height="10" rx="3" fill="#09090B" fill-opacity="0.7" />
      <rect x="14" y="58" width="34" height="6" rx="3" fill="#FAFAFA" fill-opacity="0.8" />
      <rect x="14" y="70" width="38" height="6" rx="3" fill="#FAFAFA" fill-opacity="0.55" />
      <rect x="14" y="82" width="28" height="6" rx="3" fill="#FAFAFA" fill-opacity="0.55" />
      <rect x="14" y="94" width="32" height="6" rx="3" fill="#FAFAFA" fill-opacity="0.55" />

      <!-- Main UI module -->
      <rect x="68" y="40" width="94" height="54" rx="6" fill="#FAFAFA" fill-opacity="0.24" />
      <!-- Mini bar chart inside UI -->
      <rect x="78" y="72" width="8" height="14" rx="2" fill="#FAFAFA" fill-opacity="0.7" />
      <rect x="91" y="64" width="8" height="22" rx="2" fill="#FAFAFA" fill-opacity="0.85" />
      <rect x="104" y="56" width="8" height="30" rx="2" fill="#FAFAFA" />
      <rect x="117" y="68" width="8" height="18" rx="2" fill="#FAFAFA" fill-opacity="0.75" />
      <rect x="130" y="50" width="8" height="36" rx="2" fill="#FAFAFA" />
      <rect x="143" y="60" width="8" height="26" rx="2" fill="#FAFAFA" fill-opacity="0.9" />

      <!-- Action buttons at the bottom -->
      <rect x="68" y="102" width="44" height="24" rx="5" fill="#FAFAFA" />
      <rect x="118" y="102" width="44" height="24" rx="5" fill="#09090B" fill-opacity="0.35" />
    </g>
  </g>

  <!-- 4. TYPOGRAPHY AND DESCRIPTION SECTION (Right side) -->
  <g transform="translate(348, 0)">
    
    <!-- Main title -->
    <text x="0" y="96" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-0.035em">
      <tspan fill="#FAFAFA">FiveM</tspan><tspan fill="#52525B" font-weight="400">.</tspan><tspan fill="url(#orange-grad)">Nui</tspan>
    </text>

    <!-- Header (Lead Paragraph) -->
    <text x="2" y="134" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600" fill="#E4E4E7" letter-spacing="-0.01em">
      The modern, high-performance, strongly typed bridge between
    </text>
    <text x="2" y="156" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="600" fill="#E4E4E7" letter-spacing="-0.01em">
      <tspan fill="#FAFAFA" font-weight="700">C# client scripts</tspan> and <tspan fill="#FF7A3D" font-weight="700">NUI frontends</tspan> for FiveM.
    </text>

    <!-- Divider -->
    <line x1="2" y1="176" x2="560" y2="176" stroke="#27272A" stroke-width="1.5" />

    <!-- Second paragraph (Technical details) -->
    <text x="2" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#A1A1AA">
      Stop wrestling with JSON parsing bugs, focus locks, and untyped callback spaghetti.
    </text>
    <text x="2" y="222" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#A1A1AA">
      Build responsive, production-ready FiveM user interfaces with <tspan fill="#E4E4E7" font-weight="600">.NET 10</tspan>, <tspan fill="#E4E4E7" font-weight="600">Svelte 5 runes</tspan>,
    </text>
    <text x="2" y="242" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="400" fill="#A1A1AA">
      and <tspan fill="#E4E4E7" font-weight="600">compile-time contract generation</tspan>.
    </text>

    <!-- 5. BOTTOM TECH BADGES (Pills) -->
    <g transform="translate(2, 266)" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11" font-weight="600">
      
      <!-- Badge 1: .NET 10 -->
      <g transform="translate(0, 0)">
        <rect width="84" height="28" rx="6" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#EA580C" />
        <text x="24" y="18" fill="#F4F4F5">.NET 10</text>
      </g>

      <!-- Badge 2: SVELTE 5 RUNES -->
      <g transform="translate(94, 0)">
        <rect width="134" height="28" rx="6" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#FF7A3D" />
        <text x="24" y="18" fill="#F4F4F5">SVELTE 5 RUNES</text>
      </g>

      <!-- Badge 3: COMPILE-TIME CONTRACTS -->
      <g transform="translate(238, 0)">
        <rect width="188" height="28" rx="6" fill="#18181B" stroke="#3F3F46" stroke-width="1" />
        <circle cx="14" cy="14" r="3.5" fill="#10B981" />
        <text x="24" y="18" fill="#F4F4F5">COMPILE-TIME CONTRACTS</text>
      </g>

      <!-- Badge 4: STRONGLY TYPED -->
      <g transform="translate(436, 0)">
        <rect width="128" height="28" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
        <text x="14" y="18" fill="#A1A1AA">STRONGLY TYPED</text>
      </g>

    </g>
  </g>
</svg>