# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

output: prefixed

vars:
  DIST_DIR: '{{.ROOT_DIR}}/dist'

includes:
  fivem-nui:
    taskfile: ./packages/fivem-nui/Taskfile.yml
    dir: ./packages/fivem-nui
    aliases: [nui]
  svelte:
    taskfile: ./packages/svelte/Taskfile.yml
    dir: ./packages/svelte

tasks:
  default:
    desc: Build all TypeScript packages and the .NET solution
    cmds:
      - task: build

  build:
    desc: Build all packages in dependency order, followed by the .NET solution
    cmds:
      - task: build:packages
      - task: build:dotnet

  build:packages:
    desc: Build all TypeScript packages (fivem-nui -> svelte) in dependency order
    cmds:
      - task: fivem-nui:build
      - task: svelte:build

  build:dotnet:
    desc: Build the .NET solution
    cmds:
      - dotnet build FiveM.Nui.slnx -c Release

  pack:
    desc: Pack all packages (npm .tgz and NuGet .nupkg) into dist/
    cmds:
      - task: pack:packages
      - task: pack:dotnet

  pack:packages:
    desc: Pack all TypeScript packages into .tgz archives in dist/
    cmds:
      - mkdir -p "{{.DIST_DIR}}"
      - task: fivem-nui:pack
      - task: svelte:pack

  pack:dotnet:
    desc: Pack all .NET NuGet packages into dist/
    cmds:
      - mkdir -p "{{.DIST_DIR}}"
      - dotnet pack FiveM.Nui.slnx -c Release -o "{{.DIST_DIR}}"

  check:
    desc: Typecheck all TypeScript packages in parallel
    deps:
      - fivem-nui:check
      - svelte:check

  test:
    desc: Run all tests (TypeScript packages + .NET test suites)
    cmds:
      - task: test:packages
      - task: test:dotnet

  test:packages:
    desc: Run tests across all TypeScript packages
    cmds:
      - task: fivem-nui:test
      - task: svelte:test

  test:dotnet:
    desc: Run .NET test suites
    cmds:
      - dotnet test FiveM.Nui.slnx

  coverage:
    desc: Run test coverage across all packages
    cmds:
      - task: fivem-nui:coverage
      - task: svelte:coverage

  install:
    desc: Install npm dependencies in all packages in parallel
    deps:
      - fivem-nui:install
      - svelte:install

  clean:
    desc: Clean build artifacts across all packages, .NET solution, and dist/
    cmds:
      - task: fivem-nui:clean
      - task: svelte:clean
      - dotnet clean FiveM.Nui.slnx
      - rm -rf "{{.DIST_DIR}}"

  benchmarks:
    desc: Run .NET performance benchmarks
    cmds:
      - dotnet run -c Release --project tests/FiveM.Nui.Benchmarks/FiveM.Nui.Benchmarks.csproj

  contracts:
    desc: Build the FiveM.Nui.Contracts Roslyn generator CLI tool
    cmds:
      - dotnet build tools/FiveM.Nui.Contracts/FiveM.Nui.Contracts.csproj -c Release
